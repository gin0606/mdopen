[package]
name = "mdopen"
# 版は git tag が唯一の真実。ここは cargo が必須にしている項目なので固定値を置く
# (`cargo install` はこの値を表示するが、リリースの版とは関係が無い)。
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
# 配布は Homebrew から行うので crates.io には出さない。
publish = false

# パッケージ名 mdopen は CLI と app を含む一式の名前。CLI そのものは変換しか
# しないので、コマンド名は役割を言う mdhtml にする。
[[bin]]
name = "mdhtml"
path = "src/main.rs"

[dependencies]
ammonia = "4.2"
base64 = "0.22"
comrak = { version = "0.54", default-features = false, features = [
    "shortcodes",
    "syntect-fancy",
] }
html5ever = "0.39"
libc = "0.2"
markup5ever_rcdom = "0.39.0"
sha2 = "0.10"
syntect = { version = "5.3", default-features = false, features = [
    "default-themes",
    "html",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
