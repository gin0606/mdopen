[package]
name = "mdo"
# 版は git tag が唯一の真実。ここは cargo が必須にしている項目なので固定値を置く
# (`cargo install` はこの値を表示するが、リリースの版とは関係が無い)。
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
# 配布は Homebrew から行うので crates.io には出さない。
publish = false

[dependencies]
comrak = { version = "0.54", default-features = false, features = [
    "shortcodes",
    "syntect-fancy",
] }
opener = "0.8"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
